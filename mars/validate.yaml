# nm validate config — Mars surface radiation environment
#
# Endpoints for validation and error signals. Claude composes the validation
# and learning pipelines via MCP; this file just lists what data is available
# and where to find it.
#
# Driver-measurement context: MAVEN lost contact December 2025. Phase I Mars
# validation runs MSL/Curiosity RAD as the live direct error signal for
# surface dose and charged particle flux, with propagated heliospheric state
# from L1 measurements (DSCOVR, ACE, SWPC alerts) as live driver input via
# ENLIL/cone-model output. The MAVEN archive (2014-2025) supplies retrospective
# driver state. ESCAPADE (arrival September 2027) is the Phase II live-driver
# replacement.
#
# Role taxonomy:
#   direct_error_signal   — sensor measures the target observable directly
#   proxy_error_signal    — sensor measures related observable via proxy chain
#   input                 — driver measurement consumed at runtime
#   prediction_baseline   — operational model output for comparison
#   state_index           — derived index for phase tagging / baseline construction
#   archived_input        — historical-only data, used for retrospective cycles

version: "0.1"
schema: nm-validate
provenance:
  added: "2026-05-15"
  added_by: heidi
  evidence:
    - swwx_2026_anomaly_resolution_thread
    - maven_loss_of_contact_dec_2025
    - msl_rad_pds_archive_continuous

domain: space-weather
region_set: mars
entity_scope: mars_surface_four_ls_seasons
model_id: mars-v0.1

# --- DATA ENDPOINTS ---

endpoints:

  # =====================================================================
  # DIRECT ERROR SIGNALS
  # MSL/Curiosity RAD measures the predicted observables directly at the
  # Mars surface. Operating continuously since August 2012; data publicly
  # archived at NASA Planetary Data System (PDS).
  # =====================================================================

  - name: msl_rad_dose_rate
    role: direct_error_signal
    target_observable: surface_dose_rate
    source: msl_curiosity_rad
    instrument: "RAD (Radiation Assessment Detector)"
    pi: "Don Hassler (Southwest Research Institute)"
    protocol: archive_pull
    endpoint: "https://pds-ppi.igpp.ucla.edu/data/MSL-M-RAD-3-RDR-V1.0/"
    endpoint_kind: pds3_archive_tree
    archive_layout:
      index: "INDEX/INDEX.TAB"
      data: "DATA/SOL_{NNNNN}_{NNNNN}/RAD_RDR_YYYY_DOY_HH_MM_NNNN_V00.{LBL,TXT}"
      coverage: "2012-08 (Sol 0) through 2025-308 — 5,435 daily product files"
    cadence: PT1H
    format:
      kind: pds3_label_plus_ascii
      dose_block: "[DOSIMETRY_TOTAL_DOSE_B: NN]"
      target_field: "dose_rate_b (µGy/day; derived from total dose / integration duration)"
      units: "μGy/day"
    notes: |
      Primary validation source for Mars regime. Continuous operation since
      landing (Aug 2012). Provides quiet-time GCR baseline and records every
      SEP event reaching Mars surface during the mission. Each per-sol product
      is a PDS3 .LBL/.TXT pair; dose-rate is derived from total-dose blocks
      divided by integration duration (recorded in counter headers).

  - name: msl_rad_charged_particle_spectrum
    role: direct_error_signal
    target_observable: integral_charged_particle_flux
    source: msl_curiosity_rad
    instrument: "RAD-E (Energy spectrum channels)"
    pi: "Don Hassler (Southwest Research Institute)"
    protocol: archive_pull
    endpoint: "https://pds-ppi.igpp.ucla.edu/data/MSL-M-RAD-3-RDR-V1.0/"
    cadence: PT1H
    format:
      fields: [sol, ls, charged_particle_flux_e, energy_channel]
      derived:
        - { name: integral_flux_gt_10mev_per_nuc, formula: "sum over E >= 10 MeV/nuc channels" }
    notes: "RAD-E provides energy-resolved charged particle flux; substrate predicts integral above 10 MeV/nuc as a scalar observable"

  # =====================================================================
  # DRIVER INPUTS (LIVE)
  # No direct upstream measurement at Mars after MAVEN loss. Live driver
  # state comes from L1 measurements propagated to Mars distance via
  # operational heliospheric models, plus event detection from SWPC alerts.
  # The substrate is honest that these are model-propagated values, not
  # direct measurement — propagation error is part of the total residual
  # the substrate learns from.
  # =====================================================================

  - name: enlil_solar_wind_at_mars
    role: input
    drivers_fed: [heliospheric_sw_speed_at_mars]
    source: ccmc_enlil
    instrument: "ENLIL-with-cone heliospheric model"
    protocol: http
    endpoint: "https://iswa.gsfc.nasa.gov/iswa_data_tree/model/heliosphere/wsa_enlil/"
    endpoint_kind: archive_root
    cadence: PT6H
    format:
      fields: [timestamp, distance_au, sw_speed, sw_density, b_radial]
      filter: "Mars heliocentric distance"
    propagation_uncertainty: "ENLIL median absolute error at Mars distance ~50 km/s in speed; tracked as part of total residual"
    notes: "Live solar wind state at Mars distance; modeled, not measured. Acknowledged uncertainty propagates into edge residuals."

  - name: swpc_sep_alerts_mars_relevant
    role: input
    drivers_fed: [solar_proton_event_at_mars]
    source: noaa_swpc
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/products/alerts.json"
    cadence: event_driven
    format:
      fields: [issue_datetime, product_id, message]
      filter: "Proton event alerts (Mars-arrival timing inferred from event onset + Mars heliographic position)"
    notes: |
      SWPC declares SEP events based on Earth-orbiting sensors. Mars arrival
      timing must be inferred from event source longitude and Mars heliographic
      position. The per-event arrival-time edge is tested against MSL RAD
      response.

  - name: enlil_cme_at_mars
    role: input
    drivers_fed: [cme_shock_at_mars]
    source: ccmc_enlil
    instrument: "ENLIL-with-cone CME propagation"
    protocol: http
    endpoint: "https://iswa.gsfc.nasa.gov/iswa_data_tree/model/heliosphere/wsa_enlil/"
    endpoint_kind: archive_root
    cadence: event_driven
    format:
      fields: [cme_id, mars_arrival_predicted, shock_strength]
    notes: "ENLIL with cone-CME predicts shock arrival timing at Mars heliocentric distance"

  - name: mars_atmospheric_column_climatology
    role: input
    drivers_fed: [atmospheric_column_density]
    source: mcd_climatology
    instrument: "Mars Climate Database climatology"
    protocol: archive_pull
    endpoint: "http://www-mars.lmd.jussieu.fr/mars/access.html"
    endpoint_kind: archive_root
    cadence: PT6H
    format:
      fields: [ls, lat, lon, surface_pressure, scale_height, column_density]
      filter: "Curiosity site (Gale Crater, ~4.6S, 137.4E)"
    notes: |
      Mars Climate Database provides climatological atmosphere; for live
      operation can be augmented with MSL REMS surface pressure (which
      gives column-proxy via hydrostatic relation). Dust-storm column
      enhancement is event-driven via dust_storm_index input.

  - name: mars_dust_storm_index
    role: input
    drivers_fed: [dust_storm_activity]
    source: mars_climate_sounder_archive
    instrument: "MCS (Mars Climate Sounder) on Mars Reconnaissance Orbiter"
    protocol: archive_pull
    endpoint: "https://pds-atmospheres.nmsu.edu/data_and_services/atmospheres_data/MARS/mro_mcs.html"
    cadence: P1D
    format:
      fields: [sol, ls, dust_opacity, scale_factor]
    notes: "MRO/MCS provides daily dust opacity maps; substrate consumes as binary or graded dust_storm_activity state"

  # =====================================================================
  # ARCHIVED INPUTS (retrospective only)
  # MAVEN archive 2014-2025 supplies direct Mars-distance solar wind, IMF,
  # and ion measurements for retrospective storm-replay validation cycles.
  # NOT a live data source after Dec 2025 loss of contact.
  # =====================================================================

  - name: maven_solar_wind_archive
    role: archived_input
    drivers_fed: [heliospheric_sw_speed_at_mars]
    source: maven_pds_archive
    instrument: "MAVEN SWIA (Solar Wind Ion Analyzer)"
    protocol: archive_pull
    endpoint: "https://pds-ppi.igpp.ucla.edu/data/maven/"
    cadence: PT4S
    format:
      fields: [time, density, speed, temperature]
    coverage: "2014-09-22 through 2025-12-04"
    use: retrospective_storm_replay
    notes: |
      MAVEN lost contact Dec 6, 2025. As of March 2026 NASA considers
      mission "likely unrecoverable" but archived data through Dec 2025
      remains publicly available. Used for retrospective Phase I cycles
      where direct Mars-distance driver measurement removes L1-propagation
      uncertainty from per-edge residuals.

  - name: maven_imf_archive
    role: archived_input
    drivers_fed: [solar_proton_event_at_mars]
    source: maven_pds_archive
    instrument: "MAVEN MAG (Magnetometer)"
    protocol: archive_pull
    endpoint: "https://pds-ppi.igpp.ucla.edu/data/maven/"
    cadence: PT1S
    format:
      fields: [time, bx, by, bz, btot]
    coverage: "2014-09-22 through 2025-12-04"
    use: retrospective_storm_replay
    notes: "IMF measurements at Mars during MAVEN operational period; informs Mars-Sun magnetic connection during retrospective SEP events"

  - name: maven_sep_archive
    role: archived_input
    drivers_fed: [solar_proton_event_at_mars]
    source: maven_pds_archive
    instrument: "MAVEN SEP (Solar Energetic Particle instrument)"
    protocol: archive_pull
    endpoint: "https://pds-ppi.igpp.ucla.edu/data/maven/"
    cadence: PT8S
    format:
      fields: [time, energy, flux, look_direction]
    coverage: "2014-09-22 through 2025-12-04"
    use: retrospective_storm_replay
    notes: "Direct measurement of SEP arrival at Mars during MAVEN operational period; ground truth for SEP-arrival edges in retrospective validation"

  # =====================================================================
  # STATE INDICES
  # =====================================================================

  - name: solar_cycle_phase
    role: state_index
    source: noaa_swpc
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/products/solar-cycle/observed-solar-cycle-indices.json"
    cadence: P1M
    format:
      fields: [time, ssn_obs, ssn_predicted, f107]
    use_phase: [baseline_construction]
    notes: "Solar cycle phase informs GCR modulation baseline; slowly-varying over Phase I window"

  - name: mars_ls_orbital_phase
    role: state_index
    source: derived
    derivation: "Computed from Mars ephemeris (JPL Horizons)"
    cadence: PT1H
    format:
      fields: [time, ls_degrees]
    use_phase: [voxel_selection, baseline_construction]
    notes: "Determines current season-region for substrate voxel selection"

  # =====================================================================
  # PREDICTION BASELINES (operational model outputs for context)
  # =====================================================================

  - name: nairas_mars_dose_prediction
    role: prediction_baseline
    target_observable: [surface_dose_rate]
    source: nairas_mars_module
    protocol: http
    endpoint: "https://sol.spdf.gsfc.nasa.gov/nairas/"
    endpoint_kind: archive_root
    cadence: PT6H
    format:
      fields: [timestamp, location, dose_rate_predicted]
    validation_discipline: model_output
    notes: "NAIRAS operational radiation model; comparison-only baseline"

  # =====================================================================
  # PHASE II FORWARD MARKERS
  # Sources that will become available in Phase II timeframe (2027-2028).
  # Not consumed during Phase I; documented here to scope Phase II proposal.
  # =====================================================================

  - name: escapade_blue_gold_partnership
    role: phase_i_partnership_target
    source: escapade_mission
    instrument: "EMAG, EESA, EIA, ELP across both spacecraft"
    status_summary: |
      Launched Nov 13, 2025. Instruments operational since Feb 25, 2026.
      Currently loitering at Earth-Sun L2 with kidney-bean orbit extending
      2-4 million km from Earth, including passages through the distant
      magnetotail (not measured since Wind mission, 1990s) and a near-moon
      passage. Trans-Mars injection Nov 7-9, 2026. Mars orbit insertion
      September 2027. Science campaigns mid-2028.
    data_access: "SIMPLEx proprietary period; partnership access via PI engagement"

    phase_i_value:
      cislunar_gap_reduction: |
        ESCAPADE's near-moon passage during L2 loiter provides direct
        particle and field measurement IN CISLUNAR SPACE — the regime
        currently declared as measurement-gap. Even sparse snapshot
        passes turn cislunar from pure-proxy validation (GEO proton flux
        as proxy chain) into sparse-direct + proxy validation. The
        substrate can quantify proxy-chain error against direct
        measurement on passes where ESCAPADE data exists.
      l2_propagation_validation: |
        ESCAPADE at L2 measures the same solar wind structures DSCOVR
        sees at L1, with known geometric separation. Substrate can learn
        L1-to-L2 propagation accuracy by comparing predicted-at-ESCAPADE
        state against measured-at-ESCAPADE state. This is a step toward
        L1-to-Mars propagation validation: same propagation model class,
        non-zero heliocentric separation, ground-truthed.
      geo_magnetotail_constraint: |
        L2 distant-magnetotail observations could constrain the
        field-line-stretching physics in GEO regime's pre-midnight growth
        phase voxel — addresses "Substorm onset prediction lead time"
        in GEO known_gaps.

    phase_ii_value:
      direct_driver_measurement_at_mars: |
        From mid-2028, ESCAPADE provides simultaneous twin-spacecraft
        measurements of Mars solar wind, magnetosphere, and ion escape —
        the upstream driver measurements Phase I has to work around via
        L1 propagation. Becomes the live-driver replacement for MAVEN.

    expected_drivers_fed:
      phase_i_partnership: [solar_proton_event_at_mars, cislunar_environmental_context]
      phase_ii_operational: [heliospheric_sw_speed_at_mars, cme_shock_at_mars, solar_proton_event_at_mars]

    engagement_plan: |
      Phase I Task 3.3 (NASA collaborator engagement, 60 hours) includes
      Rob Lillis outreach to scope: (1) ESCAPADE loiter-data access for
      cislunar passage windows, (2) collaboration on substrate framework
      for analyzing loiter-phase observations against L1 baselines, and
      (3) Phase II Mars-driver-measurement partnership architecture.
