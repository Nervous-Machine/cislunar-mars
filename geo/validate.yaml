# nm validate config — GEO energetic particle and field environment
#
# Endpoints for validation and error signals. Claude composes the validation
# and learning pipelines via MCP; this file just lists what data is available
# and where to find it.
#
# Role taxonomy:
#   direct_error_signal   — sensor measures the target observable directly
#   proxy_error_signal    — sensor measures a related observable via a proxy chain
#   input                 — driver measurement consumed at runtime
#   prediction_baseline   — operational model output for comparison
#   state_index           — derived index for phase tagging and baseline construction
#
# Cadence convention: ISO 8601 durations (PT60S, PT5M, PT1H, P1D) for time
# intervals. Reserved literals: static, event_driven, archive_pull, continuous.

version: "0.1"
schema: nm-validate
provenance:
  added: "2026-05-14"
  added_by: heidi
  evidence:
    - swwx_2026_anomaly_resolution_thread
    - grace_fo_precedent_pipeline

domain: space-weather
region_set: geo
entity_scope: geo_orbit_six_lt_regions
model_id: geo-v0.1

# --- DATA ENDPOINTS ---

endpoints:

  # =====================================================================
  # DIRECT ERROR SIGNALS
  # GOES-R measures the predicted observables directly at GEO.
  # These are the primary validation sources — substrate predicts,
  # GOES measures the same observable, ε drives Z evolution.
  # =====================================================================

  - name: goes_seiss_epead_mev_electrons
    role: direct_error_signal
    target_observable: e_flux_gt_2mev
    source: goes_r_seiss
    instrument: "EPEAD (Energetic Proton, Electron, Alpha Detectors)"
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/json/goes/primary/integral-electrons-1-day.json"
    cadence: PT5M
    format:
      fields: [time_tag, energy, flux]
      energy_channel_target: ">=2 MeV"
    notes: "Primary validation for internal charging risk forecasting"

  - name: goes_seiss_sgps_protons_10mev
    role: direct_error_signal
    target_observable: p_flux_gt_10mev
    source: goes_r_seiss
    instrument: "SGPS (Solar and Galactic Proton Sensor)"
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
    cadence: PT5M
    format:
      fields: [time_tag, energy, flux]
      energy_channel_target: ">=10 MeV"
    notes: "Primary validation for SEE-onset SEP forecasting"

  - name: goes_seiss_sgps_protons_50mev
    role: direct_error_signal
    target_observable: p_flux_gt_50mev
    source: goes_r_seiss
    instrument: "SGPS (Solar and Galactic Proton Sensor)"
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
    cadence: PT5M
    format:
      fields: [time_tag, energy, flux]
      energy_channel_target: ">=50 MeV"
    notes: "Higher-energy SEP component; faster arrival, smaller cutoff effects"

  - name: goes_seiss_mps_lo_hot_plasma
    role: direct_error_signal
    target_observable: e_flux_hot_plasma
    source: goes_r_seiss
    instrument: "MPS-LO (Magnetospheric Particle Sensor - Low Energy)"
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/json/goes/primary/differential-electrons-1-day.json"
    cadence: PT1M
    format:
      fields: [time_tag, energy, flux]
      energy_channel_target: "1-50 keV"
    notes: "Primary validation for surface charging risk forecasting"

  - name: goes_mag_b_field
    role: direct_error_signal
    target_observable: b_field_magnitude
    source: goes_r_series
    instrument: "MAG (Magnetometer)"
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/json/goes/primary/magnetometers-1-day.json"
    cadence: PT1M
    format:
      fields: [time_tag, Hp, He, Hn, total]
      target_field: "total"
    notes: "Local field magnitude at GEO; magnetospheric state observable"

  # =====================================================================
  # DRIVER INPUTS
  # Driver measurements consumed at runtime. These feed predictions
  # via the contribution edges in prior.yaml; they are NOT error signals.
  # =====================================================================

  - name: dscovr_solar_wind_plasma
    role: input
    drivers_fed: [solar_wind_dynamic_pressure, solar_wind_speed]
    source: dscovr
    instrument: "PlasMag / Faraday Cup"
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json"
    cadence: PT1M
    format:
      fields: [timestamp, density, speed, temperature]
      derived:
        - { name: dynamic_pressure, formula: "1.6726e-6 * density * speed^2" }
    notes: "Primary L1 solar wind measurement; dynamic pressure derived from density and speed"

  - name: dscovr_imf
    role: input
    drivers_fed: [imf_bz]
    source: dscovr
    instrument: "PlasMag Magnetometer"
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/products/solar-wind/mag-1-day.json"
    cadence: PT1M
    format:
      fields: [timestamp, bx_gsm, by_gsm, bz_gsm, bt]
      target_field: bz_gsm
    notes: "IMF Bz from L1; signature is Bz southward (negative) for magnetospheric driving"

  - name: ace_solar_wind_legacy
    role: input
    drivers_fed: [solar_wind_speed]
    source: ace
    instrument: "SWEPAM"
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/json/ace/swepam/ace_swepam_1h.json"
    cadence: PT1H
    format:
      fields: [time_tag, dsflag, dens, speed, temperature]
    notes: "Legacy backup to DSCOVR; cross-validate before consuming"

  - name: swpc_cme_alerts
    role: input
    drivers_fed: [cme_arrival]
    source: noaa_swpc
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/products/alerts.json"
    cadence: event_driven
    format:
      fields: [issue_datetime, product_id, message]
      filter: "CME-related alerts"
    notes: "Event-driven feed; CME arrival timing extracted from operational alerts"

  - name: swpc_sep_alerts
    role: input
    drivers_fed: [solar_proton_event]
    source: noaa_swpc
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/products/alerts.json"
    cadence: event_driven
    format:
      fields: [issue_datetime, product_id, message]
      filter: "Proton event alerts"
    notes: "SEP onset declared operationally by SWPC; substrate consumes as event trigger"

  # =====================================================================
  # STATE INDICES (baseline construction, storm-phase tagging only)
  # NOT drivers, NOT error signals. Used for quiet-time baseline
  # construction (as in GRACE-FO pipeline) and storm-phase labeling
  # during validation. See state_indices block in prior.yaml.
  # =====================================================================

  - name: swpc_kp
    role: state_index
    source: noaa_swpc
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
    cadence: PT3H
    format:
      fields: [time_tag, kp]
    use_phase: [baseline_construction, storm_phase_tagging]
    notes: "Planetary geomagnetic index; correlates with substrate predictions but is not a causal driver"

  - name: swpc_dst
    role: state_index
    source: noaa_swpc
    protocol: http
    endpoint: "https://services.swpc.noaa.gov/products/kyoto-dst.json"
    cadence: PT1H
    format:
      fields: [time_tag, dst]
    use_phase: [baseline_construction, storm_phase_tagging]
    notes: "Ring current index; used for quiet-time identification (Dst > -30) and storm-phase tagging"

  # =====================================================================
  # PREDICTION BASELINES (operational model outputs for context only)
  # =====================================================================

  - name: ae9_ap9_climatology
    role: prediction_baseline
    target_observable: [e_flux_gt_2mev, p_flux_gt_10mev]
    source: irene_ae9_ap9
    protocol: file
    cadence: static
    format:
      fields: [L_shell, energy, flux_percentile]
    validation_discipline: statistical_climatology
    notes: "Climatological baselines; not real-time; informs context only"

  - name: enlil_solar_wind_prediction
    role: prediction_baseline
    target_observable: [b_field_magnitude]
    source: ccmc_enlil
    protocol: http
    endpoint: "https://iswa.gsfc.nasa.gov/iswa_data_tree/model/heliosphere/wsa_enlil/"
    endpoint_kind: archive_root
    cadence: PT6H
    format:
      fields: [timestamp, sw_speed_predicted, sw_density_predicted, cme_arrival_predicted]
    validation_discipline: model_output
    notes: "ENLIL predicts L1 conditions; reference baseline for comparison"
