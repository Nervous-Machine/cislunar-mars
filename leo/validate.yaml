# nm validate config — LEO thermosphere density (space-atlas)
#
# Endpoints for validation and error signals. Claude composes the validation
# and learning pipelines via MCP; this file just lists what data is available
# and where to find it.
#
# Cadence convention: ISO 8601 durations (PT10S, PT1H, P1D) with reserved
# literals: static, event_driven, archive_pull, continuous.

version: "0.1"
schema: nm-validate
provenance:
  added: "2026-05-13"
  added_by: heidi
  evidence:
    - grace_fo_dryrun_results_2026_03
    - space_atlas_grace_fo_convergence_benchmark

domain: space-weather
region_set: leo
entity_scope: thermosphere-density-460-510km

# --- DATA ENDPOINTS ---

endpoints:

  - name: gracefo_density_files
    bucket: measurement
    source: gracefo
    protocol: file
    endpoint: "./data/grace-fo/raw"
    download_script: "scripts/download-grace-fo.js"
    cadence_raw: PT10S
    cadence_processed: PT1H
    format:
      file_pattern: "GC_DNS_ACC_*.txt"
      delimiter: whitespace
      filter: "flag == 0"
      fields_indexed:
        date: 0
        time: 1
        altitude_m: 3
        longitude_deg: 4
        latitude_deg: 5
        local_solar_time_h: 6
        density_kg_m3: 8
        flag: 10
    maps_to: [density_at_voxel]
    role: primary_error_signal
    notes: "Hourly average computed in-memory by voxel-hour bucket"

  - name: weather_hourly_db
    bucket: drivers
    source: weather_hourly
    protocol: mongodb
    endpoint: "${MONGODB_URI}"
    db: space-waze
    collection: weather_hourly
    cadence: PT1H
    format:
      fields: [timestamp, imf_bz, dst, ae_index, solar_wind_speed, solar_wind_density]
    maps_to: [imf_bz, dst, ae_index, solar_wind_speed, solar_wind_density]
    role: input
    lookup_strategy:
      method: backward_lag_per_edge
      tolerance_hours: 1
      note: "Per-edge backward lookup at obsTime - lag; fall back to ±1h if exact hour missing"
