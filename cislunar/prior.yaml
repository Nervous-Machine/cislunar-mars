# nm prior config — cislunar space radiation and particle/field environment
#
# Sources for prior provisioning: external data, model documentation, and
# expert priors Claude can draw on to inform the cislunar prior beyond its
# own training-data inference. Sensor endpoints live in cislunar/validate.yaml.
#
# Predicted observables (the targets the prior is built for):
#   - cislunar_dose_rate       — TID at lunar orbit (Artemis crew, CLPS hardware)
#   - cislunar_particle_field  — IMF + energetic particle environment in
#                                 cislunar space (SEE risk, surface charging)
#   - lunar_surface_dose       — surface dose at lunar locations (currently
#                                 validated only at Chang'E 4 site)
#
# Cislunar is a CONVERGENCE regime in Phase I, not a measurement-gap regime.
# CRaTER on LRO (2009-present, ~17 years), THEMIS-ARTEMIS P1/P2 (2011-present,
# ~15 years), and Chang'E 4 LND (2019-present) provide paired direct
# measurement against the same L1 drivers used at GEO and LEO. Remaining
# genuine measurement gaps are documented in measurement_gaps at the end of
# this file.
#
# Voxel granularity is provisional: three physics-region voxels by
# magnetospheric shielding regime. Subdivision criteria are declared per
# region.
#
# Scale convention:
#   linear  — multiplier in linear space (default)
#   log     — multiplier in log space (SEP-driven edges >2 OOM)

version: "0.1"
schema: nm-prior
provenance:
  added: "2026-05-15"
  added_by: heidi
  evidence:
    - swwx_2026_anomaly_resolution_thread
    - nasa_sbir_spwx_1_s26a_subtopic
    - grace_fo_precedent_pipeline
    - geo_prior_pattern
    - mars_prior_pattern
    - crater_lro_continuous_operation_2009_present
    - themis_artemis_continuous_operation_2011_present
    - change4_lnd_first_lunar_surface_dose_2019

domain: space-weather
entity: cislunar-space-radiation-and-fields
scope: per-region-x-observable

# --- REGIONS ---
# Cislunar physics-region voxels by magnetospheric shielding regime.
# Granularity is provisional; the substrate may subdivide regions as
# direct-measurement convergence reveals sub-region variance.

regions:

  - id: inner_magnetospheric
    spatial_definition: "Geocentric distance ≤10 RE; consistently inside Earth's magnetopause under typical solar wind conditions"
    operational_significance: |
      Magnetosphere provides substantial shielding from SEPs and lower-
      energy GCRs. Trapped radiation belt populations (Van Allen belts)
      contribute distinct dose components in this region. Cislunar transit
      vehicles spend hours-to-days passing through this region during
      lunar-bound trajectories.
    phase_ii_subdivision_criteria: |
      Substrate would subdivide this region if direct measurement showed
      residuals correlating with: (a) inner vs outer belt structure;
      (b) magnetopause position variability under high dynamic pressure;
      (c) plasmapause boundary effects on plasma populations.
      Required measurement: dose rate at multiple radial distances within
      the region, simultaneously, during a single transit event.

  - id: magnetotail_transit
    spatial_definition: "Geocentric distance ~10-60 RE on the nightside; intermittent magnetospheric shielding"
    operational_significance: |
      Variable shielding regime. The Moon's monthly traverse of the
      magnetotail means cislunar assets pass through this region with
      varying degrees of magnetospheric vs solar wind exposure. Plasma
      sheet boundary crossings produce abrupt shielding regime changes.
      THEMIS-ARTEMIS has characterized this region's plasma sheet
      structure extensively but per-edge causal substrate learning has
      not been applied to the available data.
    phase_ii_subdivision_criteria: |
      Substrate would subdivide based on: (a) plasma sheet vs lobe
      occupancy; (b) magnetotail "windsock" oscillation amplitude under
      solar wind pressure variations; (c) substorm injection regions.
      Required measurement: dose rate AND plasma context simultaneously
      at multiple magnetotail positions.

  - id: outer_lunar_vicinity
    spatial_definition: "Lunar orbit altitude through Earth-Moon L1/L2 region; ~60 RE geocentric distance"
    operational_significance: |
      Predominantly solar wind exposure with intermittent magnetotail
      occupancy depending on Moon's lunar phase relative to Sun-Earth
      line. Direct GCR exposure; SEP arrival timing similar to L1 but
      with potential geometric modulation. THEMIS-ARTEMIS provides
      paired field+plasma measurements; LRO/CRaTER provides paired
      dosimetry at lunar orbit. Chang'E 4 provides surface-level cross-
      validation point.
    phase_ii_subdivision_criteria: |
      Substrate would subdivide based on: (a) inside vs outside the
      lunar magnetic shadow (lunar wake); (b) Earth-Moon-Sun geometric
      phase (eclipse vs full-Moon configurations); (c) sun-facing vs
      anti-sunward lunar hemisphere for surface dose validation.
      Required measurement: simultaneous dose and field measurements at
      multiple cislunar positions, ideally including transit volumes.

# --- PREDICTED OBSERVABLES ---

predicted_observables:

  - id: cislunar_dose_rate
    name: "Cislunar total ionizing dose rate at lunar orbit altitude"
    units: "μGy/hour"
    operational_relevance: tid_budgeting_artemis_crew_clps_hardware
    risk_category: cumulative_radiation_dose
    cadence_target: PT1H
    scale: linear
    notes: |
      CRaTER baseline ~10-15 μGy/hour quiet time at lunar orbit (varies
      with solar cycle phase via GCR modulation); enhanced 10-100x during
      major SEP events. Linear scale is adequate for the dominant variation;
      SEP-driven enhancement edges use log scale per the scale: field at
      the edge level.

  - id: cislunar_particle_field
    name: "Cislunar IMF and energetic particle environment"
    units: "composite — nT for field, particles/(cm^2·s·sr) for flux"
    operational_relevance: see_risk_and_charging_risk_and_driver_state
    risk_category: single_event_effects_and_charging
    cadence_target: PT1M
    scale: linear
    component_observables:
      - imf_btot_at_lunar_distance
      - imf_bz_at_lunar_distance
      - integral_particle_flux_gt_1mev_at_lunar_distance
      - plasma_electron_density_at_lunar_distance
    notes: |
      THEMIS-ARTEMIS measures all four component observables directly at
      lunar distance. The substrate predicts each as a function of L1
      driver state propagated to lunar distance; ARTEMIS measurements
      provide direct error signals for each component.

  - id: lunar_surface_dose
    name: "Lunar surface dose rate"
    units: "μGy/hour"
    operational_relevance: future_crew_surface_operations
    risk_category: cumulative_radiation_dose_surface
    cadence_target: PT1H
    scale: linear
    measurement_status: |
      Direct measurement available only at Chang'E 4 far-side site (Jan
      2019-present). LRO/CRaTER provides lunar-orbit dose which cross-
      validates to surface via published albedo modeling (Chang'E 4 LND
      and CRaTER agreed within instrument uncertainty during Feb 2019
      overflight). Phase II CLPS partnership would add multiple lunar
      surface measurement points.
    notes: |
      Substrate predicts surface dose from orbital dose plus modeled
      lunar albedo contribution (8-20% of total dose per published
      transport modeling). Validation against Chang'E 4 LND is sparse
      but high-value as a ground-truth point.

# --- DRIVER CONTRIBUTORS ---

driver_contributors:

  # --------------------------------------------------------------
  # Operational model documentation (Z_0 = 0.40)
  # --------------------------------------------------------------
  operational_model_documentation:
    starting_certainty: 0.40
    description: "Edges from operational model documentation — well-characterized but model-derived priors"
    drivers:

      - id: solar_proton_event
        name: solar proton event onset at L1
        source_documentation: ["HESPERIA REleASE", "UMASEP", "AE9/AP9"]
        contributes_to:
          - target_observable: cislunar_dose_rate
            initial_multiplier_bound: [1.0, 100.0]
            response_lag_hours: [0, 12]
            scale: log
            mechanism: "SEP arrival drives 10-100x dose rate enhancement in cislunar space; arrival timing modulated by magnetospheric configuration in inner_magnetospheric region"
          - target_observable: cislunar_particle_field
            initial_multiplier_bound: [1.0, 1000.0]
            response_lag_hours: [0, 12]
            scale: log
            mechanism: "SEP arrival drives 2-3 OOM enhancement in cislunar energetic particle flux"
          - target_observable: lunar_surface_dose
            initial_multiplier_bound: [1.0, 80.0]
            response_lag_hours: [0, 18]
            scale: log
            mechanism: "Surface SEP dose modulated by atmospheric absence (no shield) and lunar regolith albedo; somewhat lower enhancement than orbit due to surface geometry"

      - id: cme_arrival
        name: CME shock arrival at lunar distance
        source_documentation: ["ENLIL-with-cone", "OSPREI"]
        contributes_to:
          - target_observable: cislunar_particle_field
            initial_multiplier_bound: [0.7, 3.0]
            response_lag_hours: [0.3, 2]
            scale: linear
            mechanism: "Shock compression of magnetotail; field perturbations propagate to lunar distance with delay relative to L1 arrival"

      - id: magnetospheric_state
        name: magnetopause position and magnetotail configuration
        source_documentation: ["Shue magnetopause model", "Tsyganenko magnetic field models"]
        contributes_to:
          - target_observable: cislunar_dose_rate
            initial_multiplier_bound: [0.5, 1.2]
            response_lag_hours: [0, 1]
            scale: linear
            mechanism: "Magnetospheric configuration modulates SEP penetration to inner cislunar; substrate learns the modulation per voxel via paired CRaTER/ARTEMIS data"

  # --------------------------------------------------------------
  # Peer-reviewed literature (Z_0 = 0.35)
  # --------------------------------------------------------------
  literature:
    starting_certainty: 0.35
    description: "Edges from peer-reviewed cislunar radiation environment and heliospheric literature"
    drivers:

      - id: imf_bz
        name: IMF Bz (southward component) at L1
        contributes_to:
          - target_observable: cislunar_particle_field
            initial_multiplier_bound: [0.7, 2.5]
            response_lag_hours: [0.3, 2]
            scale: linear
            mechanism: "Southward Bz drives magnetospheric reconfiguration; affects cislunar plasma populations via magnetotail dynamics — characterized extensively in THEMIS-ARTEMIS literature"

      - id: solar_wind_dynamic_pressure
        name: solar wind dynamic pressure at L1
        contributes_to:
          - target_observable: cislunar_particle_field
            initial_multiplier_bound: [0.8, 2.0]
            response_lag_hours: [0.3, 1]
            scale: linear
            mechanism: "Dynamic pressure variation moves magnetopause and stretches magnetotail; alters lunar exposure to solar wind vs magnetospheric environment (the windsock effect documented in THEMIS-ARTEMIS observations)"

      - id: solar_wind_speed
        name: solar wind speed at L1
        contributes_to:
          - target_observable: cislunar_particle_field
            initial_multiplier_bound: [0.8, 2.0]
            response_lag_hours: [1, 4]
            scale: linear
            mechanism: "Solar wind speed propagates to lunar distance with delay; modulates particle transport and arrival timing"

  # --------------------------------------------------------------
  # SME knowledge (Z_0 = 0.50)
  # --------------------------------------------------------------
  sme_knowledge:
    starting_certainty: 0.50
    description: "Expert priors — populated via Phase I SME engagement"
    sme_contact_slot: "Cislunar radiation and lunar mission SME — engagement pending"
    drivers: []

  # --------------------------------------------------------------
  # Foundation-model training corpus (Z_0 = 0.30)
  # --------------------------------------------------------------
  foundation_model_training:
    starting_certainty: 0.30
    description: "Edges hypothesized from foundation-model corpus without direct literature or doc support"
    drivers: []

# --- STATE INDICES ---

state_indices:

  - id: lunar_phase
    name: Earth-Moon-Sun geometric phase
    derivation: "Computed from lunar ephemeris (JPL Horizons)"
    correlates_with:
      - cislunar_particle_field  # determines magnetotail vs solar wind exposure
      - cislunar_dose_rate       # via shielding regime
    use_phase: [voxel_selection, baseline_construction]
    notes: |
      Lunar phase determines which physics region the Moon is currently
      traversing. Full Moon = magnetotail exposure; New Moon = solar wind
      exposure; quarter Moon = boundary regions. Used to select voxel and
      construct phase-specific baselines.

  - id: solar_cycle_phase
    name: Solar cycle phase / GCR modulation level
    derivation: "From NOAA SWPC solar cycle indices; sunspot number, F10.7; inverse relationship to GCR access"
    correlates_with:
      - cislunar_dose_rate       # GCR modulation sets quiet-time baseline; high solar activity → reduced GCR access; low solar activity → enhanced GCR
      - lunar_surface_dose       # surface GCR follows orbit GCR with albedo contribution
    use_phase: [baseline_construction]
    notes: |
      Slowly-varying over Phase I window (relative to event timescales).
      CRaTER record 2009-present spans 1.5+ solar cycles, providing
      well-characterized GCR modulation baselines per cycle phase.
      Used to construct quiet-time dose floors per voxel × cycle phase
      rather than as a per-edge causal driver — substrate cannot learn
      11-year modulation as a per-event multiplier on Phase I timescale.

  - id: kp_index
    name: Kp planetary geomagnetic index
    derivation: "Aggregated from ground magnetometer disturbance"
    correlates_with:
      - cislunar_particle_field
    use_phase: [storm_phase_tagging]
    notes: "Operationally known correlate of magnetospheric state; not a causal driver"

  - id: dst_index
    name: Dst ring current index
    derivation: "Aggregated from low-latitude ground magnetometers"
    correlates_with:
      - cislunar_dose_rate
      - cislunar_particle_field
    use_phase: [baseline_construction, storm_phase_tagging]
    notes: "Used for quiet-time identification (Dst > -30) per GRACE-FO precedent"

# --- INTERACTIONS ---

interactions:

  - factors: [solar_proton_event, magnetospheric_state, lunar_phase]
    type: shielding_dependent_arrival
    note: |
      SEP penetration to inner_magnetospheric region depends on
      magnetospheric state. Outer_lunar_vicinity exposure depends on
      lunar phase relative to Sun-Earth line. Same SEP event produces
      different cislunar dose responses depending on geometric
      configuration at arrival time.

  - factors: [magnetotail_stretching, lunar_phase, solar_wind_dynamic_pressure]
    type: windsock_effect
    note: |
      THEMIS-ARTEMIS observed: high solar wind pressure pushes magnetotail
      aside, exposing Moon to solar wind even when geometrically inside
      the magnetotail. This is the windsock effect that the substrate
      should learn from paired ARTEMIS field data + L1 pressure measurements.

  - factors: [gcr_modulation_state, solar_proton_event]
    type: anticorrelated_baseline_event_pairing
    note: |
      Same as Mars: SEP frequency peaks at solar maximum when GCR
      modulation is strongest. Net dose budget is non-monotonic in
      solar cycle phase. CRaTER 2009-present record captures this
      across 1.5+ cycles.

# --- MEASUREMENT GAPS ---
# Specific unresolved questions where Phase I direct measurement is
# inadequate. These are sharpened gaps, not full-regime gaps. Phase II
# CLPS partnership and ESCAPADE engagement would address them directly.

measurement_gaps:

  - id: transit_volume_dose_resolution
    description: |
      Dose rate at intermediate distances between LEO and lunar orbit
      (the cislunar "transit" volume) is not directly measured. CRaTER
      is at ~50 km lunar altitude; LEO dosimeters (multiple) are at
      LEO; the transit volume between has only model interpolations
      and occasional crewed-mission measurements (Apollo legacy data,
      Artemis II expected 2026).
    phase_ii_target: "CLPS-mission dosimetry during transit; Artemis crew dosimetry archive"
    affected_regions: [inner_magnetospheric, magnetotail_transit]

  - id: high_energy_sep_spectrum_resolution
    description: |
      CRaTER's microdosimeter has limited energy resolution above ~55 MeV
      protons. Substrate predictions of ultra-high-energy SEP component
      (>100 MeV/nuc, responsible for hardware SEEs) lack direct
      validation in cislunar at the spectral resolution required for
      hardware risk forecasting.
    phase_ii_target: "Dedicated SEP spectrometer on CLPS payload or Artemis ancillary"
    affected_regions: [outer_lunar_vicinity, magnetotail_transit]

  - id: near_surface_vs_orbital_dose_difference
    description: |
      Surface dose validation exists only at Chang'E 4 far-side site
      (single point). Lunar surface dose varies with regolith composition,
      latitude, and slope; the lunar near-side may differ from far-side.
      Substrate's surface dose predictions cannot be regionally validated.
    phase_ii_target: "Multi-site CLPS dosimetry across near-side, far-side, and polar locations"
    affected_regions: [outer_lunar_vicinity]

  - id: cislunar_ion_composition_at_high_resolution
    description: |
      THEMIS-ARTEMIS measures plasma electrons and ions at lunar distance
      but ion composition resolution is limited. SEP composition (proton vs
      heavy ion fraction) affects SEE risk asymmetrically and substrate
      cannot fully constrain this with current cislunar measurements.
    phase_ii_target: "ESCAPADE near-moon-passage composition data during loiter; future dedicated SEP composition instrument"
    affected_regions: [outer_lunar_vicinity]

# --- KNOWN GAPS ---
# Operational gaps the prior recognizes at composition time.

known_gaps:
  - "Real-time forecast lead time for cislunar SEP arrival (currently retrospective via L1 + propagation)"
  - "Lunar regolith composition variability effect on albedo dose contribution"
  - "Trapped radiation belt response during major storms (CRaTER samples but does not optimize for inner magnetospheric voxel)"
  - "Spatial resolution within physics-region voxels (provisional 3-region grid; subdivision criteria declared per region)"
